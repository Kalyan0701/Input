[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "svfbo"
version = "0.1.0"
description = "SVF-BO vs independent BO on heterogeneous facilities (First Step)"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "scikit-learn",
    "torch",
    "matplotlib",
    "joblib",
]

[tool.setuptools.packages.find]
include = ["svfbo*"]